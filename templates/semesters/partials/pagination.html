
{% if page_obj.paginator.num_pages > 1 %}

<div class="card-footer bg-white">

    <nav aria-label="Results pagination">

        <ul class="pagination mb-0 justify-content-center">

            {% if page_obj.has_previous %}

            <li class="page-item">
                <a class="page-link"
                   data-ajax-page
                   href="?{% if base_query %}{{ base_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">
                    Previous
                </a>
            </li>

            {% endif %}

            <li class="page-item disabled">
                <span class="page-link">
                    {{ page_obj.number }}
                    /
                    {{ page_obj.paginator.num_pages }}
                </span>
            </li>

            {% if page_obj.has_next %}

            <li class="page-item">
                <a class="page-link"
                   data-ajax-page
                   href="?{% if base_query %}{{ base_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">
                    Next
                </a>
            </li>

            {% endif %}

        </ul>
    </nav>
</div>

{% endif %}
