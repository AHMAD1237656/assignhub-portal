{% extends "base.html" %}

{% block title %}Reset Password - AssignHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3>Forgot Password?</h3>

                <p class="text-muted">
                    Enter your registered email address.
                </p>

                <form method="post">
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label">
                                {{ field.label }}
                            </label>

                            <div>{{ field }}</div>
                            {{ field.errors }}
                        </div>
                    {% endfor %}

                    <button class="btn btn-dark w-100" type="submit">
                        Send Reset Link
                    </button>
                </form>

                <a href="{% url 'accounts:login' %}"
                   class="d-block mt-3">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
